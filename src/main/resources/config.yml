# NexusNPC v0.1.0
#
# This is the CORE build: mob-type NPCs (real entities) and player-skinned "Steve" NPCs
# (packet-based, via the separately-installed PacketEvents plugin), skins fetched from a real
# player's username, and two starter traits (look-at-nearby-players, patrol between waypoints).
#
# Deliberately NOT in this version -- these are the "go really crazy" asks and are big enough to
# be their own follow-up phases rather than guesses baked into a first release: Sentinel-style
# combat (NPCs attacking hostiles/intruders to defend a base), full autonomous decision-making
# (an NPC that acts on its own rather than just running the traits you attach to it), and
# scripted/branching dialogue. See CHANGES.md for the full list of what's built vs. deferred.

npc:
  # how often (in ticks, 20 = 1 second) every spawned NPC's traits are re-evaluated (look-at
  # direction recalculated, next patrol step taken, etc.)
  tick-interval-ticks: 10
  # a player-type NPC's fake tab-list entry is hidden again this many ticks after it's added --
  # it has to be added briefly for the client to actually load/render the skin, but doesn't need
  # to sit in the real tab list permanently
  hide-from-tablist-after-ticks: 40
  # how close (in blocks) a player has to be for a look-close trait to make an NPC face them
  look-close-range: 8.0
  # default patrol step: how far (blocks) an NPC moves per tick-interval while patrolling, and
  # how close (blocks) counts as "arrived" at a waypoint
  patrol-step-blocks: 0.2
  patrol-arrival-radius: 0.5

skin:
  # cached skin lookups (username -> texture value/signature) are kept for this many minutes
  # before a fresh Mojang API lookup is allowed again for that same username -- avoids hammering
  # Mojang's session server if someone runs /npc skin on the same name repeatedly
  cache-minutes: 60
